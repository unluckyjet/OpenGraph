<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'self'; script-src 'self'"
    />
    <title>OpenGraph</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="titlebar">
      <div class="titlebar-left">
        <button class="icon-button" title="Toggle sidebar" id="toggleSidebar">
          <svg viewBox="0 0 16 16" width="15" height="15">
            <rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" />
            <line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" />
          </svg>
        </button>
        <button class="icon-button" title="Back">
          <svg viewBox="0 0 16 16" width="15" height="15">
            <path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="1.4" />
          </svg>
        </button>
        <button class="icon-button" title="Forward">
          <svg viewBox="0 0 16 16" width="15" height="15">
            <path d="M6 3 L11 8 L6 13" fill="none" stroke="currentColor" stroke-width="1.4" />
          </svg>
        </button>
        <nav class="menu">
          <button>File</button>
          <button>Edit</button>
          <button>View</button>
          <button>Help</button>
        </nav>
      </div>
      <div class="titlebar-drag"></div>
      <div class="window-buttons">
        <button data-window="minimize" title="Minimize">
          <svg viewBox="0 0 12 12" width="11" height="11"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" /></svg>
        </button>
        <button data-window="maximize" title="Maximize">
          <svg viewBox="0 0 12 12" width="11" height="11"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" /></svg>
        </button>
        <button data-window="close" class="close" title="Close">
          <svg viewBox="0 0 12 12" width="11" height="11">
            <line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" />
            <line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" />
          </svg>
        </button>
      </div>
    </div>

    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <button class="brand">
            Codex
            <svg viewBox="0 0 12 12" width="11" height="11"><path d="M3 4.5 L6 8 L9 4.5" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
          <div class="sidebar-head-actions">
            <button class="icon-button" title="Search">
              <svg viewBox="0 0 16 16" width="15" height="15">
                <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3" />
                <line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.3" />
              </svg>
            </button>
            <button class="icon-button" title="Notifications">
              <svg viewBox="0 0 16 16" width="15" height="15">
                <path d="M4 11 V7 a4 4 0 0 1 8 0 v4 l1 1.5 H3 Z" fill="none" stroke="currentColor" stroke-width="1.2" />
                <path d="M6.5 13.5 a1.6 1.6 0 0 0 3 0" fill="none" stroke="currentColor" stroke-width="1.2" />
              </svg>
            </button>
          </div>
        </div>

        <div class="new-chat">
          <button class="new-chat-main">
            <svg viewBox="0 0 16 16" width="15" height="15">
              <path d="M11.5 2.5 L13.5 4.5 L5.5 12.5 L3 13 L3.5 10.5 Z" fill="none" stroke="currentColor" stroke-width="1.2" />
            </svg>
            New chat
          </button>
          <button class="icon-button" title="New">
            <svg viewBox="0 0 16 16" width="15" height="15">
              <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2" />
              <line x1="8" y1="5.4" x2="8" y2="10.6" stroke="currentColor" stroke-width="1.2" />
              <line x1="5.4" y1="8" x2="10.6" y2="8" stroke="currentColor" stroke-width="1.2" />
            </svg>
          </button>
        </div>

        <div class="tree" id="tree"></div>

        <div class="sidebar-foot">
          <button class="account">
            <span class="avatar">PA</span>
            <span class="account-name">Professional A...</span>
          </button>
          <button class="foot-button">
            <svg viewBox="0 0 16 16" width="14" height="14">
              <line x1="3" y1="6" x2="3" y2="10" stroke="currentColor" stroke-width="1.4" />
              <line x1="6" y1="4" x2="6" y2="12" stroke="currentColor" stroke-width="1.4" />
              <line x1="9" y1="5.5" x2="9" y2="10.5" stroke="currentColor" stroke-width="1.4" />
              <line x1="12" y1="7" x2="12" y2="9" stroke="currentColor" stroke-width="1.4" />
            </svg>
            Voice
          </button>
          <button class="icon-button" title="Help">
            <svg viewBox="0 0 16 16" width="15" height="15">
              <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2" />
              <path d="M6.3 6.2 a1.8 1.8 0 1 1 1.9 2.1 V9.4" fill="none" stroke="currentColor" stroke-width="1.2" />
              <circle cx="8.1" cy="11.4" r="0.7" fill="currentColor" />
            </svg>
          </button>
        </div>
      </aside>

      <main class="canvas">
        <button class="icon-button panel-toggle" title="Toggle panel">
          <svg viewBox="0 0 16 16" width="15" height="15">
            <rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" />
            <line x1="10.5" y1="2.5" x2="10.5" y2="13.5" stroke="currentColor" />
          </svg>
        </button>

        <div class="stage" id="stage"></div>

        <div class="composer">
          <div class="composer-tabs">
            <button class="tab">
              <svg viewBox="0 0 16 16" width="13" height="13">
                <path d="M3 3 L13 13 M13 3 L3 13" stroke="currentColor" stroke-width="1.2" fill="none" />
              </svg>
              UI Library
            </button>
            <button class="tab">
              <svg viewBox="0 0 16 16" width="13" height="13">
                <rect x="2" y="3.5" width="12" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.2" />
                <line x1="5.5" y1="13.5" x2="10.5" y2="13.5" stroke="currentColor" stroke-width="1.2" />
              </svg>
              Local
            </button>
            <button class="tab">
              <svg viewBox="0 0 16 16" width="13" height="13">
                <circle cx="4.5" cy="4" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2" />
                <circle cx="4.5" cy="12" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2" />
                <circle cx="11.5" cy="4" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2" />
                <path d="M4.5 5.6 V10.4 M11.5 5.6 V8 a2 2 0 0 1-2 2 H6" fill="none" stroke="currentColor" stroke-width="1.2" />
              </svg>
              main
            </button>
          </div>

          <div class="composer-box">
            <input id="prompt" type="text" placeholder="Do anything" autocomplete="off" />
            <div class="composer-row">
              <div class="composer-left">
                <button class="icon-button round" title="Add">
                  <svg viewBox="0 0 16 16" width="15" height="15">
                    <line x1="8" y1="4" x2="8" y2="12" stroke="currentColor" stroke-width="1.3" />
                    <line x1="4" y1="8" x2="12" y2="8" stroke="currentColor" stroke-width="1.3" />
                  </svg>
                </button>
                <button class="ghost">
                  <svg viewBox="0 0 16 16" width="13" height="13">
                    <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2" />
                    <line x1="4" y1="12" x2="12" y2="4" stroke="currentColor" stroke-width="1.2" />
                  </svg>
                  Approve for me
                </button>
              </div>
              <div class="composer-right">
                <button class="ghost">
                  <span class="model">5.6 Sol</span>
                  <span class="effort">Extra High</span>
                  <svg viewBox="0 0 12 12" width="10" height="10"><path d="M3 4.5 L6 8 L9 4.5" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
                </button>
                <button class="icon-button" title="Dictate">
                  <svg viewBox="0 0 16 16" width="15" height="15">
                    <rect x="6" y="2" width="4" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.2" />
                    <path d="M4 8 a4 4 0 0 0 8 0" fill="none" stroke="currentColor" stroke-width="1.2" />
                    <line x1="8" y1="12" x2="8" y2="14" stroke="currentColor" stroke-width="1.2" />
                  </svg>
                </button>
                <button class="send" title="Send">
                  <svg viewBox="0 0 16 16" width="15" height="15">
                    <line x1="3" y1="8" x2="3" y2="8" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
                    <line x1="5.5" y1="5.5" x2="5.5" y2="10.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
                    <line x1="8" y1="3" x2="8" y2="13" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
                    <line x1="10.5" y1="5.5" x2="10.5" y2="10.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
                    <line x1="13" y1="7" x2="13" y2="9" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
